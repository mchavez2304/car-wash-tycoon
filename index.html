<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Car Wash Tycoon</title>
<meta name="description" content="Grow an express car wash chain from three San Antonio tunnels into the biggest in America, against private-equity roll-ups.">
<meta name="theme-color" content="#0c2536">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Wash Tycoon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'12'%20fill%3D'%23ffb000'%2F%3E%3Ctext%20x%3D'32'%20y%3D'42'%20font-family%3D'Arial%2CHelvetica%2Csans-serif'%20font-weight%3D'900'%20font-size%3D'26'%20text-anchor%3D'middle'%20fill%3D'%232b1c00'%3ECW%3C%2Ftext%3E%3C%2Fsvg%3E">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Car Wash Tycoon
   Layout: an operations board in a wash bay. Navy tunnel chrome frames a bright working floor;
   signage amber marks the player's money and washes; an LED ticker runs the news along the bottom.
   One deliberate look (light floor, navy chrome), so colors are set explicitly rather than per theme. */
:root {
  color-scheme: light;
  --bg: #e7eef3;          /* foam mist */
  --panel: #ffffff;
  --panel-2: #f3f7fa;
  --ink: #0f2130;
  --ink-2: #4a5f70;
  --ink-3: #7d8f9d;
  --line: #d2dde5;
  --line-2: #e4ebf0;
  --chrome: #0c2536;      /* tunnel navy */
  --chrome-2: #14354c;
  --chrome-3: #1d4763;
  --chrome-ink: #e5f2fa;
  --chrome-ink-2: #93b3c8;
  --accent: #0a9fc0;      /* rinse cyan */
  --accent-2: #087f9a;
  --accent-soft: #dff4f9;
  --sign: #ffb000;        /* signage amber: you */
  --sign-2: #e09a00;
  --sign-soft: #fff3d6;
  --sign-ink: #2b1c00;
  --good: #188a50;
  --good-soft: #def5e8;
  --warn: #b97600;
  --warn-soft: #fff1d6;
  --bad: #c93a36;
  --bad-soft: #fde4e2;
  --led: #ffb347;
  --led-bg: #120d06;
  --foam-pink: #ff6fa5;
  --foam-blue: #5fb8ff;
  --foam-yellow: #ffd84a;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r: 7px;
  --gap: 12px;
}

* { box-sizing: border-box; }
/* The page host pads the root by the phone's safe areas; navy there blends with the HUD and the tab bar. */
html { height: 100%; background: var(--chrome); }
body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
#app { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent-2); }

/* ---------- boot ---------- */
.boot { height: 100%; display: grid; place-content: center; gap: 10px; text-align: center; background: var(--chrome); color: var(--chrome-ink); }
.boot-sign { font-family: var(--font-display); font-weight: 900; font-size: 44px; letter-spacing: 0.04em; color: var(--sign); }
.boot-sub { color: var(--chrome-ink-2); }

/* ---------- app frame ---------- */
.app {
  height: 100%;
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr) 280px;
  grid-template-rows: auto minmax(0, 1fr) 30px;
  grid-template-areas: 'hud hud hud' 'nav main goals' 'tick tick tick';
}
.app.no-goals { grid-template-columns: 76px minmax(0, 1fr); grid-template-areas: 'hud hud' 'nav main' 'tick tick'; }
.app.no-goals .goals { display: none; }

/* HUD */
.hud {
  grid-area: hud;
  background: var(--chrome);
  color: var(--chrome-ink);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 14px;
  border-bottom: 3px solid var(--sign);
  min-width: 0;
}
.hud-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; }
.hud-logo { width: 34px; height: 34px; border-radius: 6px; background: var(--sign); color: var(--sign-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 15px; flex: none; }
.hud-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.hud-date { display: flex; flex-direction: column; line-height: 1.1; min-width: 118px; }
.hud-date b { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 0.02em; }
.hud-date span { color: var(--chrome-ink-2); font-size: 12px; white-space: nowrap; }
.speed { display: flex; gap: 2px; background: var(--chrome-2); border-radius: 8px; padding: 3px; }
.speed button { border: 0; background: transparent; color: var(--chrome-ink-2); width: 34px; height: 30px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.speed button:hover { background: var(--chrome-3); color: var(--chrome-ink); }
.speed button.on { background: var(--sign); color: var(--sign-ink); }
.speed svg { width: 16px; height: 16px; }
.hud-stats { display: flex; gap: 18px; margin-left: auto; min-width: 0; }
.hud-stat { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.hud-stat span { font-size: 11px; color: var(--chrome-ink-2); text-transform: uppercase; letter-spacing: 0.08em; }
.hud-stat b { font-family: var(--font-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.hud-stat b.money { color: var(--sign); }
.hud-stat b.neg { color: #ff8a80; }
.hud-stat b.pos { color: #7be3a8; }
.hud-menu { border: 1px solid var(--chrome-3); background: transparent; color: var(--chrome-ink); border-radius: 8px; height: 34px; padding: 0 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.hud-menu:hover { background: var(--chrome-2); }

/* NAV rail */
.nav { grid-area: nav; background: var(--chrome-2); display: flex; flex-direction: column; gap: 2px; padding: 8px 6px; overflow-y: auto; }
.nav-group { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--chrome-ink-2); text-align: center; margin: 8px 0 2px; }
.nav button {
  border: 0; background: transparent; color: var(--chrome-ink-2); border-radius: 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px; font-size: 11px; position: relative;
}
.nav button svg { width: 22px; height: 22px; }
.nav button:hover { background: var(--chrome-3); color: var(--chrome-ink); }
.nav button.on { background: var(--chrome); color: var(--sign); }
.nav button.on::before { content: ''; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--sign); }
.nav .dot { position: absolute; top: 5px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

/* MAIN */
.main { grid-area: main; overflow: auto; min-width: 0; padding: 16px; padding-bottom: 28px; }
.screen { display: flex; flex-direction: column; gap: var(--gap); max-width: 1320px; margin: 0 auto; }
.screen-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.screen-head h1 { font-family: var(--font-display); font-weight: 900; font-size: 32px; letter-spacing: 0.01em; line-height: 1; }
.screen-head .sub { color: var(--ink-2); max-width: 70ch; }
.screen-head .grow { flex: 1; }

/* GOALS */
.goals { grid-area: goals; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.goals h3 { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: 0.02em; }
.goal { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; font-size: 13px; color: var(--ink); }
.goal.done { color: var(--ink-3); text-decoration: line-through; }
.goal .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.goal.done .box { background: var(--good); border-color: var(--good); color: white; }
.goal.next .box { border-color: var(--sign); }

/* TICKER */
.ticker { grid-area: tick; background: var(--led-bg); color: var(--led); overflow: hidden; position: relative; display: flex; align-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
.ticker-label { flex: none; background: var(--sign); color: var(--sign-ink); padding: 0 10px; height: 100%; display: flex; align-items: center; z-index: 1; }
.ticker-track { white-space: nowrap; display: inline-flex; gap: 48px; padding-left: 100%; animation: tick 70s linear infinite; }
.ticker-track span.bad { color: #ff7a6b; }
.ticker-track span.good { color: #8ff0b0; }
.ticker-track span.rival { color: #d7a2ff; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; padding-left: 16px; } }

/* ---------- building blocks ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 0; flex-wrap: wrap; }
.panel-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: 0.02em; }
.panel-head .grow { flex: 1; }
.panel-head .hint { color: var(--ink-2); font-size: 12.5px; }
.panel-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel.flat { background: var(--panel-2); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row.tight { gap: 6px; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.grow { flex: 1; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 700; }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.good-t { color: var(--good); }
.bad-t { color: var(--bad); }
.warn-t { color: var(--warn); }
.sign-t { color: var(--sign-2); }

.grid { display: grid; gap: var(--gap); min-width: 0; }
.grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.side { grid-template-columns: minmax(0, 1fr) 360px; }
.grid.side-l { grid-template-columns: 340px minmax(0, 1fr); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.kpi .value { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kpi .delta { font-size: 12px; color: var(--ink-2); }
.kpi.you .value { color: var(--sign-2); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 7px 12px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; line-height: 1.2; }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent-2); }
.btn.sign { background: var(--sign); border-color: var(--sign-2); color: var(--sign-ink); }
.btn.sign:hover { background: var(--sign-2); }
.btn.danger { color: var(--bad); border-color: #efc2bf; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.lg { padding: 11px 18px; font-size: 16px; }
.btn svg { width: 16px; height: 16px; }

/* segmented */
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(15, 33, 48, 0.15); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }

/* pills and badges */
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11.5px; font-weight: 700; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.you { background: var(--sign-soft); color: #8a5a00; border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent-2); border-color: transparent; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

/* tables */
.table-wrap { overflow-x: auto; min-width: 0; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--panel-2); }
table.t tr.you td { background: var(--sign-soft); }
table.t tr.sel td { background: var(--accent-soft); }

/* fields */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.input, select.input { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: white; min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.money-in { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { accent-color: var(--accent); width: 100%; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
textarea.input { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }

/* meters */
.meter { height: 8px; border-radius: 4px; background: var(--line-2); overflow: hidden; min-width: 60px; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.meter.good > i { background: var(--good); }
.meter.warn > i { background: var(--warn); }
.meter.bad > i { background: var(--bad); }

/* stat list */
.stats { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13.5px; }
.stats dt { color: var(--ink-2); }
.stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.click { cursor: pointer; }
.card.click:hover { border-color: var(--accent); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card h3 { font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: 0.01em; }

/* canvases */
.canvas-box { position: relative; width: 100%; background: var(--chrome); border-radius: var(--r); overflow: hidden; }
.canvas-box canvas { display: block; width: 100%; height: 100%; }
.canvas-overlay { position: absolute; inset: 0; pointer-events: none; }
.canvas-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(8, 20, 30, 0.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 10px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
.modal.wide { width: min(820px, 100%); }
.modal-head { padding: 16px 18px 6px; display: flex; gap: 10px; align-items: center; }
.modal-head h2 { font-family: var(--font-display); font-weight: 900; font-size: 26px; flex: 1; }
.modal-body { padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line-2); }

/* toasts */
.toasts { position: fixed; right: 16px; bottom: 44px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100% - 32px)); }
.toast { background: var(--chrome); color: var(--chrome-ink); border-left: 4px solid var(--good); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); font-size: 13.5px; }
.toast.bad { border-left-color: var(--bad); }

/* empty states */
.empty { padding: 26px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; align-items: center; }

/* ---------- title screen ---------- */
.title { position: fixed; inset: 0; background: var(--chrome); color: var(--chrome-ink); overflow: auto; }
.title canvas.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-inner { position: relative; min-height: 100%; display: grid; place-items: center; padding: 24px 16px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
.title-card { width: min(520px, 100%); display: flex; flex-direction: column; gap: 16px; }
.marquee { background: #0a1a26; border: 3px solid var(--sign); border-radius: 12px; padding: 16px 20px 14px; box-shadow: 0 0 0 6px rgba(255, 176, 0, 0.12), 0 18px 50px rgba(0, 0, 0, 0.45); text-align: center; }
.marquee .kicker { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.3em; color: var(--chrome-ink-2); font-size: 13px; }
.marquee h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(42px, 9vw, 72px); line-height: 0.92; letter-spacing: 0.02em; color: var(--sign); text-shadow: 0 0 18px rgba(255, 176, 0, 0.35); }
.marquee .prices { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.marquee .prices span { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: 0.06em; background: #12293a; color: var(--chrome-ink); border-radius: 6px; padding: 3px 9px; }
.title-menu { background: rgba(10, 26, 38, 0.86); border: 1px solid var(--chrome-3); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(4px); }
.title-menu .btn { justify-content: center; }
.title-menu .btn:not(.sign) { background: transparent; color: var(--chrome-ink); border-color: var(--chrome-3); }
.title-menu .btn:not(.sign):hover { background: var(--chrome-2); }
.title-menu .field label { color: var(--chrome-ink-2); }
.title-menu .input { background: #0f2433; color: var(--chrome-ink); border-color: var(--chrome-3); }
.title-menu .seg { background: #0f2433; border-color: var(--chrome-3); }
.title-menu .seg button { color: var(--chrome-ink-2); }
.title-menu .seg button.on { background: var(--sign); color: var(--sign-ink); }
.title-foot { font-size: 12px; color: var(--chrome-ink-2); text-align: center; }
.scenario { border: 1px solid var(--chrome-3); border-radius: 9px; padding: 9px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: transparent; text-align: left; color: var(--chrome-ink); }
.scenario.on { border-color: var(--sign); background: rgba(255, 176, 0, 0.08); }
.scenario b { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.02em; }
.scenario span { font-size: 12.5px; color: var(--chrome-ink-2); }

/* outcome */
.outcome-grade { font-family: var(--font-display); font-weight: 900; font-size: 84px; line-height: 0.9; color: var(--sign-2); text-align: center; }

/* ---------- goal strip (narrow screens, where the sidebar is hidden) ---------- */
.goal-strip { display: none; max-width: 1320px; margin: 0 auto 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--sign); border-radius: var(--r); }
.goal-strip-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; background: transparent; cursor: pointer; text-align: left; color: var(--ink); min-height: 40px; }
.goal-strip-btn svg { flex: none; color: var(--sign-2); }
.goal-strip-text { flex: 1; min-width: 0; font-size: 13.5px; }
.goal-strip-count { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.goal-strip-list { display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 12px 14px; border-top: 1px solid var(--line-2); padding-top: 10px; }

/* ---------- mobile ---------- */
.mobile-more { display: none; }
@media (max-width: 1180px) {
  .app { grid-template-columns: 76px minmax(0, 1fr); grid-template-areas: 'hud hud' 'nav main' 'tick tick'; }
  .goals { display: none; }
  .goal-strip { display: block; }
  .grid.side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .grid.c3, .grid.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.side-l { grid-template-columns: minmax(0, 1fr); }
  .hud-stat.opt { display: none; }
}
@media (max-width: 760px) {
  body { font-size: 14px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) 26px auto; grid-template-areas: 'hud' 'main' 'tick' 'nav'; }
  .app.no-goals { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'hud' 'main' 'tick' 'nav'; }
  .hud { flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; }
  .hud-brand .hud-name { display: none; }
  .hud-brand { display: none; }
  .hud-date b { font-size: 17px; }
  .speed button { width: 32px; }
  .hud-date { min-width: 0; }
  .hud-stats { width: 100%; margin-left: 0; justify-content: space-between; gap: 8px; order: 5; }
  .hud-stat b { font-size: 18px; }
  .hud-stat span { font-size: 9.5px; }
  .hud-menu { margin-left: auto; }
  .nav { flex-direction: row; justify-content: space-around; padding: 4px 4px; overflow-x: auto; gap: 0; }
  .nav .nav-group { display: none; }
  .nav button { flex: 1; min-width: 56px; font-size: 10.5px; padding: 6px 2px; }
  .nav button.on::before { left: 10px; right: 10px; top: -4px; bottom: auto; height: 3px; width: auto; }
  .nav button.extra { display: none; }
  .mobile-more { display: flex; }
  .ticker { font-size: 13px; padding-bottom: 0; }
  .main { padding: 12px 16px 20px; }
  .screen-head h1 { font-size: 27px; }
  .grid.c2, .grid.c3, .grid.c4 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .value { font-size: 22px; }
  .toasts { bottom: 96px; right: 12px; left: 12px; max-width: none; }
  .modal-back { padding: 10px; align-items: end; }
}

/* ---------- title, help, dialogs ---------- */
.title-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12, 37, 54, 0.35) 0%, rgba(12, 37, 54, 0.72) 55%, rgba(12, 37, 54, 0.92) 100%); }
.title-menu .btn.continue { padding: 10px 16px; }
.title-menu textarea.input { min-height: 120px; }
.file-btn { position: relative; overflow: hidden; justify-content: center; }
.file-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.title-menu .file-btn { background: transparent; color: var(--chrome-ink); border-color: var(--chrome-3); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 22px; }
.how section { display: flex; flex-direction: column; gap: 4px; }
.how h3 { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: 0.02em; }
.how p { color: var(--ink-2); font-size: 13.5px; max-width: 68ch; }
.how.dark { grid-template-columns: minmax(0, 1fr); max-height: 52vh; overflow-y: auto; padding-right: 4px; }
.how.dark h3 { color: var(--sign); }
.how.dark p { color: var(--chrome-ink); }
.lead { font-size: 15.5px; color: var(--ink); max-width: 70ch; }
.flat-card { background: var(--panel-2); }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
ol.steps b { color: var(--ink); }
.more-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.more-item { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.more-item.on { border-color: var(--accent); color: var(--accent-2); background: var(--accent-soft); }
.label-caps { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); font-weight: 700; }
.outcome { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 18px; align-items: start; }
ul.notes { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
label.check { gap: 8px; cursor: pointer; align-items: flex-start; flex-wrap: nowrap; }
label.check > span { min-width: 0; }
label.check input { margin-top: 2px; }
@media (max-width: 760px) {
  .outcome { grid-template-columns: minmax(0, 1fr); }
}

/* deals.css */
/* Deal room: buyout bids (red-edged, serious), washes for sale, independents, the distress watch list. */
.deal-h2 { font-family: var(--font-display); font-size: 22px; font-weight: 800; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; letter-spacing: 0.01em; }
.deal-h2 .muted { font-family: var(--font-body); font-size: 13px; font-weight: 500; }
.deal-offers { gap: var(--gap); }

/* ----- buyout offer ----- */
.buyout {
  background: var(--panel);
  border: 1px solid #efc2bf;
  border-top: 6px solid var(--bidder, var(--bad));
  border-radius: var(--r);
  box-shadow: 0 0 0 3px var(--bad-soft), 0 10px 26px rgba(201, 58, 54, 0.12);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.buyout-top { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, var(--bad-soft), var(--panel) 90%); }
.buyout-kicker { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bad); font-size: 14px; }
.buyout-title { font-family: var(--font-display); font-weight: 900; font-size: 32px; line-height: 1.05; letter-spacing: 0.01em; max-width: 30ch; }
.buyout-price { color: var(--bad); white-space: nowrap; }
.buyout-math { display: flex; align-items: flex-end; gap: 8px 16px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); background: var(--panel-2); }
.bm-term { display: grid; grid-template-columns: auto auto; column-gap: 12px; align-items: end; }
.bm-term > i { grid-row: 1 / span 2; font-style: normal; font-size: 22px; color: var(--ink-3); font-weight: 700; line-height: 1.25; }
.bm-term > i:empty { display: none; }
.bm-term > .label-caps { grid-column: 2; }
.bm-term > b { grid-column: 2; font-family: var(--font-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.bm-term.you b { color: var(--sign-2); }
.buyout-cols { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; padding: 12px 16px; }
.buyout-truth h3, .buyout-keep h3 { font-family: var(--font-display); font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; letter-spacing: 0.01em; }
.buyout-truth h3 { color: var(--bad); }
.buyout-truth ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.buyout-keep { background: var(--good-soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; align-self: start; }
.buyout-keep h3 { color: var(--good); margin-bottom: 0; }
.buyout-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 2px 16px 16px; }
.buyout-actions .btn.lg { min-width: 210px; justify-content: center; }

/* ----- washes for sale ----- */
.offer { border-left: 4px solid var(--seller, var(--line)); gap: 10px; padding: 12px 14px; }
.offer-head { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.offer-head h3 { font-size: 21px; }
.offer-verb { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.offer-table td { vertical-align: top; }
.offer-site { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: 460px; }
.offer-math { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.offer-math > div { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.offer-math b { font-family: var(--font-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.offer-funds { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13.5px; align-items: baseline; }
.offer-funds b { font-variant-numeric: tabular-nums; }
.offer-math b.txt { font-size: 20px; }
.offer-cards { display: none; }
.offer-sitecard { display: flex; flex-direction: column; gap: 3px; padding: 8px 0; border-bottom: 1px solid var(--line-2); min-width: 0; }
.offer-sitenums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
.offer-sitenums > span { display: flex; flex-direction: column; min-width: 0; }
.offer-sitenums .label-caps { font-size: 9.5px; letter-spacing: 0.06em; }
.offer-sitenums b { font-variant-numeric: tabular-nums; }
.offer-warn { margin: 0; padding: 8px 12px 8px 28px; background: var(--warn-soft); border-radius: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; color: var(--ink); }
.offer-actions { gap: 8px; }

/* ----- nothing for sale ----- */
.deal-empty-in { display: flex; gap: 16px; align-items: flex-start; }
.deal-empty-icon { width: 60px; height: 60px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-2); display: grid; place-items: center; flex: none; }
.deal-empty h3 { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: 0.01em; }
.deal-empty p { color: var(--ink-2); max-width: 82ch; }
.deal-empty p b { color: var(--ink); }

/* ----- independents ----- */
.indie-list { display: flex; flex-direction: column; }
.indie { display: grid; grid-template-columns: minmax(0, 2.1fr) repeat(3, minmax(56px, 0.7fr)) minmax(88px, 1fr) minmax(124px, auto); gap: 10px; align-items: start; padding: 9px 4px; border-bottom: 1px solid var(--line-2); }
.indie-num .tiny { white-space: nowrap; }
.indie-name, .indie-act { align-self: center; }
.indie:last-child { border-bottom: 0; }
.indie.for-sale { background: var(--accent-soft); border-radius: 6px; }
.indie-name { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.indie-name b { display: flex; align-items: center; gap: 6px; }
.indie-num { display: flex; flex-direction: column; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
.indie-num .label-caps { font-size: 9.5px; letter-spacing: 0.08em; }
.indie-act { text-align: right; }
.indie-act .btn { justify-content: center; }

/* ----- watch list and log ----- */
.watch { display: flex; flex-direction: column; gap: 11px; }
.watch-row { display: flex; flex-direction: column; gap: 4px; }
.deal-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.deal-log li { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 8px; border-left: 3px solid var(--line); padding-left: 8px; }

@media (max-width: 760px) {
  .buyout-title { font-size: 25px; }
  .buyout-cols { grid-template-columns: minmax(0, 1fr); }
  .buyout-math { flex-direction: column; align-items: stretch; gap: 4px; }
  .bm-term { grid-template-columns: 18px minmax(0, 1fr) auto; align-items: baseline; column-gap: 6px; }
  .bm-term > i, .bm-term > i:empty { display: block; grid-row: auto; grid-column: 1; font-size: 17px; }
  .bm-term > .label-caps { grid-column: 2; }
  .bm-term > b { grid-column: 3; font-size: 21px; text-align: right; }
  .bm-term.you { border-top: 1px solid var(--line); padding-top: 5px; margin-top: 2px; }
  .offer-table-wrap { display: none; }
  .offer-cards { display: flex; flex-direction: column; }
  .offer-math b.txt { font-size: 17px; }
  .buyout-actions .btn { flex: 1 1 100%; justify-content: center; min-height: 40px; }
  .offer-math { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .offer-actions .btn { min-height: 38px; }
  .indie { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; padding: 10px 2px; }
  .indie-name { grid-column: 1 / -1; }
  .indie-num { text-align: left; }
  .indie-act { grid-column: 1 / -1; text-align: left; }
  .indie-act .btn { min-height: 36px; width: 100%; }
  .deal-empty-in { flex-direction: column; gap: 10px; }
  .deal-log li { grid-template-columns: minmax(0, 1fr); gap: 0; }
}

/* ----- for sale by owner, office costs ----- */
.offer.by-owner { border-left-color: var(--accent); }
.offer-kicker { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-2); font-size: 13px; }
.offer-headline { font-family: var(--font-display); font-size: 21px; font-weight: 800; line-height: 1.15; letter-spacing: 0.01em; max-width: 62ch; }
.offer-office { font-size: 13.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 10px; }
.offer-office .muted { font-weight: 500; }
.indie-market select { max-width: 100%; min-width: 0; }
@media (max-width: 760px) {
  .offer-headline { font-size: 19px; }
  .indie-market { width: 100%; }
  .indie-market select { flex: 1; min-height: 38px; }
}

/* finance.css */
/* Management screens, shared pieces (mg-*), used by Money, People, Upkeep, In-house and Fleets.
   They live here because finance.css loads first of the five. */
.mg-change { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.mg-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.mg-fact { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mg-fact-l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); font-weight: 600; }
.mg-fact-v { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.1; letter-spacing: 0.01em; overflow-wrap: anywhere; }
.mg-fact-s { font-size: 11.5px; color: var(--ink-2); }
.mg-fact.you { background: var(--sign-soft); border-color: transparent; }
.mg-fact.you .mg-fact-v { color: #8a5a00; }
.mg-fact.good .mg-fact-v { color: var(--good); }
.mg-fact.warn .mg-fact-v { color: var(--warn); }
.mg-fact.bad .mg-fact-v { color: var(--bad); }
.mg-callout { border-radius: var(--r); padding: 10px 12px; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 3px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2); }
.mg-callout b { color: var(--ink); }
.mg-callout.warn { background: var(--warn-soft); border-color: transparent; color: #6b4600; }
.mg-callout.bad { background: var(--bad-soft); border-color: transparent; color: #7d1f1c; }
.mg-callout.good { background: var(--good-soft); border-color: transparent; color: #11603a; }
.mg-callout.warn b, .mg-callout.bad b, .mg-callout.good b { color: inherit; }
.mg-body > .mg-callout { font-size: 13.5px; }

/* Wraps each management screen's content without adding a box (keeps the .screen flex gap). */
.mg-body { display: contents; }
/* phones: tap targets at least 36px tall */
@media (max-width: 760px) {
  .mg-body .btn.sm, .mg-body .btn { min-height: 36px; }
  .mg-body .seg button { min-height: 36px; }
  .mg-body .input { min-height: 38px; }
  .mg-body .upk-link { min-height: 30px; }
}

/* tables on desktop, cards on phones */
.mg-phone-only { display: none !important; }
@media (max-width: 760px) {
  .mg-desk-only { display: none !important; }
  .mg-phone-only { display: flex !important; }
  .mg-facts { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
}

/* ---------- Money ---------- */
.fin-kpis, .mg-kpis4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.fin-kpis .kpi .delta, .mg-kpis4 .kpi .delta { line-height: 1.3; }

/* income statement */
.fin-pl-wrap { border: 1px solid var(--line-2); border-radius: 6px; }
table.fin-pl { min-width: 100%; width: auto; font-size: 13px; }
table.fin-pl.narrow { min-width: 0; }
table.fin-pl.narrow td, table.fin-pl.narrow th:not(.fin-pl-label) { min-width: 110px; }
table.fin-pl th, table.fin-pl td { padding: 5px 6px; white-space: nowrap; }
table.fin-pl thead th { vertical-align: bottom; background: var(--panel); }
table.fin-pl .fin-pl-head { display: block; font-size: 12px; color: var(--ink); letter-spacing: 0.02em; text-transform: none; }
table.fin-pl .fin-pl-sub { display: block; font-size: 10.5px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink-3); }
table.fin-pl .fin-pl-label { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; min-width: 168px; max-width: 230px; box-shadow: 1px 0 0 var(--line); font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 500; }
table.fin-pl thead .fin-pl-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); font-weight: 700; }
table.fin-pl tbody th.fin-pl-label[title] { cursor: help; }
table.fin-pl td.partial, table.fin-pl th.partial { background: var(--panel-2); }
table.fin-pl tr.fin-row-cost .fin-pl-label, table.fin-pl tr.fin-row-line .fin-pl-label { padding-left: 16px; color: var(--ink-2); white-space: normal; }
table.fin-pl tr.fin-row-total td, table.fin-pl tr.fin-row-total th { font-weight: 800; border-top: 1px solid var(--ink-3); background-clip: padding-box; }
table.fin-pl tr.fin-row-total .fin-pl-label { font-weight: 800; }
table.fin-pl tr.fin-row-memo td, table.fin-pl tr.fin-row-memo th { color: var(--ink-2); font-style: italic; }
table.fin-pl tr.fin-row-memo:first-of-type td { border-top: 2px solid var(--line); }
table.fin-pl tr:hover td, table.fin-pl tr:hover th.fin-pl-label { background: var(--accent-soft); }

/* charts: let the last x label hang past the plot edge */
.mg-chart { padding-right: 16px; min-width: 0; }
.mg-chart svg { overflow: visible; }

/* loans */
table.fin-loans td { white-space: nowrap; }
table.fin-loans .row { flex-wrap: nowrap; }
.fin-loan-name { max-width: 260px; display: block; }
.fin-form { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.fin-credit-actions { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.fin-bills { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line-2); padding-top: 10px; }
.fin-bills .stats { gap: 3px 14px; }
.fin-req { display: flex; flex-direction: column; gap: 5px; }

/* loan cards (phone) */
.fin-loan-card { gap: 6px; }
.fin-loan-card .stats { margin: 0; }

/* ownership bar */
.fin-own { display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: var(--line-2); font-size: 12px; font-weight: 700; }
.fin-own i { display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; font-style: normal; }
.fin-own i.you { background: var(--sign); color: var(--sign-ink); }
.fin-own i.them { background: var(--chrome-3); color: var(--chrome-ink); }

@media (max-width: 900px) {
  .fin-kpis, .mg-kpis4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  table.fin-pl { font-size: 12.5px; }
  table.fin-pl .fin-pl-label { min-width: 132px; max-width: 150px; white-space: normal; line-height: 1.2; }
  table.fin-pl th, table.fin-pl td { padding: 5px 7px; }
  .mg-fact-v { font-size: 19px; }
  .fin-loan-name { max-width: 170px; }
}

/* fleets.css */
/* Fleets screen */
.flt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; align-items: start; }
.flt-card { gap: 8px; }
.flt-card.lost { background: var(--panel-2); }
.flt-card.lost h3 { color: var(--ink-2); }
.flt-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.flt-head h3 { font-size: 18px; }
.flt-stats { gap: 3px 12px; }
.flt-bid { display: flex; flex-direction: column; gap: 7px; border-top: 1px solid var(--line-2); padding-top: 9px; }
.flt-odds { display: grid; grid-template-columns: auto minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.flt-odds b { text-align: right; }
.flt-sub { display: block; }
table.flt-contracts td { white-space: nowrap; }
tr.flt-ended td { color: var(--ink-3); }
.flt-strikes { display: inline-flex; gap: 3px; }
.flt-strikes i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--line); background: var(--panel); }
.flt-strikes i.on { background: var(--bad); border-color: var(--bad); }
.flt-ccard { gap: 6px; }
.flt-ccard .stats { margin: 0; }
.flt-empty { display: flex; flex-direction: column; gap: 8px; padding: 6px 2px; }
.flt-odds-list .pill { font-weight: 600; }
@media (max-width: 760px) {
  .flt-grid { grid-template-columns: minmax(0, 1fr); }
}

/* map.css */
/* Map screen: the national dispatch board and the metro trade-area map. */

/* breadcrumb zoom toggle */
.crumbs { display: inline-flex; align-items: center; gap: 2px; background: var(--chrome); border-radius: 9px; padding: 3px; border: 1px solid var(--chrome-3); }
.crumbs button { border: 0; background: transparent; color: var(--chrome-ink-2); font-weight: 700; font-size: 13px; padding: 6px 11px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; white-space: nowrap; }
.crumbs button:hover { color: var(--chrome-ink); background: var(--chrome-2); }
.crumbs button.on { background: var(--sign); color: var(--sign-ink); }
.crumbs .sep { color: var(--chrome-ink-2); font-weight: 700; padding: 0 1px; }

/* layout: map on the left, the file on the right */
.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--gap); align-items: start; }
.map-side { gap: var(--gap); }
.map-canvas-panel .panel-head { row-gap: 8px; }
.map-canvas-panel .panel-body { gap: 8px; }
.map-box { border: 1px solid var(--chrome-3); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03); touch-action: manipulation; }
.nation-box { aspect-ratio: 1.78 / 1; min-height: 280px; }
.metro-box { height: clamp(420px, 62vh, 640px); }

/* legends */
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--ink-2); }
.lg-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-note { font-size: 12px; color: var(--ink-2); }
.lg-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; position: relative; flex: none; border: 1px solid rgba(8, 20, 30, 0.6); }
.lg-lock { position: absolute; right: -5px; top: -5px; width: 7px; height: 6px; border-radius: 1px; background: var(--chrome); }
.lg-hatch { width: 11px; height: 11px; display: inline-block; background: repeating-linear-gradient(135deg, var(--chrome) 0 2px, #8a97a3 2px 4px); border: 1px solid var(--chrome); }
.lg-x { width: 13px; height: 13px; display: inline-grid; place-items: center; border-radius: 50%; background: #8a97a3; color: var(--bad); font-style: normal; font-weight: 900; font-size: 13px; line-height: 1; }
.lg-diamond { width: 9px; height: 9px; transform: rotate(45deg); background: #3fc6e0; border: 1px solid var(--chrome); display: inline-block; margin: 0 2px; }
.ramp { display: inline-flex; flex-direction: column; gap: 2px; min-width: 210px; }
.ramp > i { display: block; height: 8px; border-radius: 4px; }
.ramp-labels { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--ink-2); white-space: nowrap; }

/* metro file (national side panel) */
.metro-file .panel-head h2 .faint { font-weight: 700; }
.file-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.file-kpis > div { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 9px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: baseline; min-width: 0; }
.file-kpis > div .label-caps { grid-column: 1 / -1; }
.file-kpis > div .tiny { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-kpis .label-caps { font-size: 9.5px; letter-spacing: 0.08em; }
.file-kpis b { font-family: var(--font-display); font-size: 21px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ink { color: var(--ink); }
.forecast { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; background: var(--chrome); border-radius: 8px; padding: 6px; }
.fc { display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--chrome-ink-2); padding: 3px 0; border-radius: 6px; }
.fc b { color: var(--chrome-ink); font-family: var(--font-display); font-size: 16px; font-weight: 800; }
.fc.today { background: var(--chrome-2); box-shadow: inset 0 0 0 1px var(--chrome-3); }
.fc.today .tiny { color: var(--sign); font-weight: 700; }
.office { display: flex; gap: 8px; align-items: flex-start; padding: 10px 11px; border-radius: 8px; background: var(--accent-soft); border: 1px solid #bfe7f1; font-size: 13px; }
.office.on { background: var(--sign-soft); border-color: #f3d48f; color: #6b4600; }
.office.on svg { color: var(--sign-2); flex: none; margin-top: 1px; }
.office.locked { background: var(--panel-2); border-color: var(--line); color: var(--ink-2); }
.office.locked svg { flex: none; margin-top: 1px; }

/* metro strip (top of the metro side column) */
.metro-strip { background: var(--chrome); color: var(--chrome-ink); border-radius: var(--r); padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 3px solid var(--sign); }
.ms-name { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: 0.01em; line-height: 1.1; }
.ms-sub { color: var(--chrome-ink-2); }
.ms-weather { display: inline-flex; align-items: center; gap: 4px; background: var(--chrome-2); border-radius: 8px; padding: 3px 8px 3px 5px; flex: none; }
.ms-weather b { font-family: var(--font-display); font-size: 18px; font-weight: 800; }
.ms-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.ms-kpis > div { display: flex; flex-direction: column; min-width: 0; }
.ms-kpis span { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--chrome-ink-2); white-space: nowrap; }
.ms-kpis b { font-family: var(--font-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.ms-kpis b.sign { color: var(--sign); }
.ms-kpis small { font-size: 13px; color: var(--chrome-ink-2); }
.ms-office { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.ms-office.on { color: var(--sign); }
.ms-office.locked { color: var(--chrome-ink-2); }
.metro-strip .btn.sign { align-self: flex-start; }

/* selected wash card */
.wash-card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ink-3); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 10px rgba(15, 33, 48, 0.08); }
.wash-card.you { background: linear-gradient(180deg, var(--sign-soft), var(--panel) 70%); }
.wash-card .btn { align-self: flex-start; }
.wc-name { font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: 0.01em; }
.wc-stats { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px 10px; }
.wc-stats > div { display: flex; flex-direction: column; min-width: 0; }
.wc-stats span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 700; }
.wc-stats b { font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* trade area file */
.sat-box { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.parcel { border: 1px solid var(--line); border-left: 3px solid #3fc6e0; border-radius: 7px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.parcel .btn { align-self: flex-start; }
.pick { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 7px 9px; cursor: pointer; min-height: 40px; }
.pick:hover { border-color: var(--accent); background: var(--accent-soft); }
.pick-rank { width: 22px; height: 22px; border-radius: 50%; background: var(--chrome); color: var(--sign); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 13px; }

/* washes table */
.wash-table td { white-space: nowrap; }
.wash-table td:first-child { white-space: normal; min-width: 150px; max-width: 260px; }

/* build dialog */
.build-parcel { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid #3fc6e0; border-radius: 8px; padding: 9px 12px; }
.build-land { font-family: var(--font-display); font-size: 22px; font-weight: 800; white-space: nowrap; }
.proto-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.card.proto { text-align: left; gap: 3px; padding: 10px 11px; font: inherit; color: inherit; }
.card.proto.sel { background: var(--accent-soft); }
.proto-name { font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: 0.01em; }
.proto-cost { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--accent-2); }
.build-quote table.t td { padding: 5px 6px; }
.build-quote tr.tot td { border-top: 2px solid var(--line); }
.after { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.after-date { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.build-problem { flex: 1 1 220px; align-self: center; }

/* national layout: map and expansion on the left, the metro file on the right (phones: map, file, expansion) */
.nation-layout { grid-template-areas: 'map file' 'exp file'; grid-template-rows: auto 1fr; }
.nation-layout .area-map { grid-area: map; }
.nation-layout .area-file { grid-area: file; }
.nation-layout .area-exp { grid-area: exp; align-self: start; }

/* phone quick read of the tapped trade area */
.ta-quick { display: none; }

/* expansion panel */
.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rung { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--panel-2); min-width: 0; }
.rung.open { background: var(--panel); border-color: #bfe3cd; }
.rung b { font-size: 13px; }
.exp-grid { align-items: start; }
.exp-table td, .exp-table th { padding: 5px 6px; }
@media (max-width: 760px) { .exp-table th { letter-spacing: 0.03em; } .exp-table td, .exp-table th { padding: 5px 4px; } }
.enter-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 8px; }
.enter-main { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.enter-main:hover b { color: var(--accent-2); }
.enter-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

@media (max-width: 1180px) {
  .map-layout { grid-template-columns: minmax(0, 1fr) 320px; }
}
@media (max-width: 980px) {
  .map-layout { grid-template-columns: minmax(0, 1fr); }
  .nation-layout { grid-template-areas: 'map' 'file' 'exp'; grid-template-rows: auto; }
  .ta-quick { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 7px 10px; }
  .ta-quick .btn { min-height: 36px; }
}
@media (max-width: 760px) {
  .map-sub .opt { display: none; }
  .crumbs button { padding: 6px 9px; font-size: 12.5px; }
  .nation-box { aspect-ratio: auto; height: max(280px, 60vw); }
  .metro-box { height: max(280px, 60vw); min-height: 280px; }
  .map-canvas-panel .panel-head .hint { display: none; }
  .map-canvas-panel .seg { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .map-canvas-panel .seg button { min-height: 36px; }
  .screen-head .crumbs { order: -1; }
  .map-legend { font-size: 11.5px; gap: 5px 10px; }
  .ramp { min-width: 0; width: 100%; }
  .file-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ladder { grid-template-columns: minmax(0, 1fr); }
  .forecast { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .build-parcel { flex-direction: column; align-items: flex-start; }
  .proto-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .build-opts, .build-quote { grid-template-columns: minmax(0, 1fr); }
  .parcel .btn, .pick { min-height: 36px; }
}

/* market.css */
/* Market screen: the roadside price board, sortable tables, build picks. */

.market-picker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.market-picker select.input { min-height: 34px; max-width: 240px; }
.seg-n { font-size: 11px; font-weight: 700; color: var(--sign-2); font-variant-numeric: tabular-nums; }

/* roadside price board */
.price-board { background: var(--chrome); border-radius: 10px; padding: 0 0 6px; border: 3px solid #0a1a26; box-shadow: inset 0 0 0 1px var(--chrome-3), 0 2px 0 rgba(15, 33, 48, 0.15); overflow: hidden; }
.pb-sign { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; background: var(--sign); color: var(--sign-ink); padding: 6px 14px; font-family: var(--font-display); font-weight: 900; font-size: 20px; letter-spacing: 0.12em; }
.pb-loc { font-size: 14px; letter-spacing: 0.16em; opacity: 0.8; }
table.pb-table { width: 100%; border-collapse: collapse; color: var(--chrome-ink); font-variant-numeric: tabular-nums; }
.pb-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--chrome-ink-2); font-weight: 700; padding: 8px 12px 6px; border-bottom: 1px solid var(--chrome-3); white-space: nowrap; }
.pb-table td { padding: 6px 12px; border-bottom: 1px solid rgba(29, 71, 99, 0.7); white-space: nowrap; }
.pb-table tr:last-child td { border-bottom: 0; }
.pb-table .r { text-align: right; }
.pb-table td.led { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--led); letter-spacing: 0.03em; text-shadow: 0 0 8px rgba(255, 179, 71, 0.35); }
.pb-table tr.you td { background: rgba(255, 176, 0, 0.14); }
.pb-table tr.you td:first-child { box-shadow: inset 4px 0 0 var(--sign); }
.pb-table tr.you td.led { color: #ffd36b; }
.pb-name { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; max-width: 260px; min-width: 0; }
.pb-you { background: var(--sign); color: var(--sign-ink); font-family: var(--font-display); font-weight: 900; font-size: 11px; letter-spacing: 0.1em; padding: 1px 6px; border-radius: 4px; }
.pb-pe { border: 1px solid #ff8a80; color: #ff8a80; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; padding: 0 4px; border-radius: 4px; }
.pb-tag { font-family: var(--font-body); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 5px; border-radius: 4px; margin-right: 6px; vertical-align: 3px; text-shadow: none; }
.pb-tag.low { background: #1f6f47; color: #b9f5d1; }
.pb-tag.high { background: #7a2421; color: #ffc9c4; }
.pb-meta { display: none; }

/* sortable headers */
th.sortable { padding: 0; }
th.sortable button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 4px; width: 100%; padding: 6px 8px; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; }
th.sortable.r button { justify-content: flex-end; }
th.sortable button:hover { color: var(--ink); }
th.sortable button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
th.sortable.on { color: var(--accent-2); }
th.sortable .arrow { font-size: 9px; width: 9px; display: inline-block; }

.ta-table td { white-space: nowrap; }
.club-cell { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.club-cell .meter { flex: 1; min-width: 60px; }

/* where to build next */
.next-list { display: flex; flex-direction: column; gap: 6px; }
.next-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 150px auto; gap: 12px; align-items: center; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; background: var(--panel); }
.next-btns { flex-wrap: nowrap; }
.next-row:nth-child(-n + 3) { border-color: #bfe7f1; background: linear-gradient(90deg, var(--accent-soft), var(--panel) 40%); }
.next-score { display: flex; align-items: center; gap: 8px; }
.next-score .meter { flex: 1; }

.indie-table td { white-space: nowrap; }
.indie-table td:first-child { max-width: 220px; }

@media (max-width: 1180px) {
  .pb-table th, .pb-table td { padding-left: 8px; padding-right: 8px; }
  .pb-table td.led { font-size: 18px; }
  .pb-tag { margin-right: 4px; }
}
@media (max-width: 760px) {
  .market-picker { justify-content: flex-start; width: 100%; }
  .market-picker .seg { width: 100%; }
  .market-picker select.input { width: 100%; max-width: none; min-height: 38px; }
  .market-picker .seg { width: auto; max-width: 100%; }
  .pb-sign { font-size: 17px; }
  /* the board becomes one two-line card per chain */
  .price-board .table-wrap { overflow: visible; }
  .pb-table thead { display: none; }
  .pb-table, .pb-table tbody { display: block; }
  .pb-table tr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 6px; padding: 8px 12px; border-bottom: 1px solid rgba(29, 71, 99, 0.7); }
  .pb-table tr:last-child { border-bottom: 0; }
  .pb-table td { border: 0; padding: 0; white-space: normal; }
  .pb-table td:first-child { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }
  .pb-table td.r { text-align: left; }
  .pb-table td.led { font-size: 19px; line-height: 1.1; }
  .pb-table td.led::before { content: attr(data-label); display: block; font-family: var(--font-body); font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--chrome-ink-2); text-shadow: none; }
  .pb-table td.pb-num { display: none; }
  .pb-meta { display: block; font-size: 11.5px; color: var(--chrome-ink-2); padding-left: 17px; }
  .pb-name { max-width: 100%; }
  .pb-tag { display: table; margin: 0 0 2px; vertical-align: 0; }
  .pb-table tr.you { background: rgba(255, 176, 0, 0.14); box-shadow: inset 4px 0 0 var(--sign); }
  .pb-table tr.you td, .pb-table tr.you td:first-child { background: transparent; box-shadow: none; }
  .hide-phone { display: none; }
  .ta-table th:first-child, .ta-table td:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); box-shadow: 1px 0 0 var(--line-2); }
  .ta-table tr.you td:first-child { background: var(--sign-soft); }
  .next-row { grid-template-columns: 24px minmax(0, 1fr); row-gap: 8px; }
  .next-score { grid-column: 2; }
  .next-btns { grid-column: 2; flex-wrap: wrap; }
  .next-btns .btn { min-height: 36px; }
}

/* menu.css */
/* Menu screen: a lit menu board (navy with amber prices), price check, sales mix, metro levels, promotions. */
.menu-board { background: linear-gradient(180deg, #0f2c40 0%, var(--chrome) 100%); border-radius: 10px; padding: 14px; border: 3px solid #071a27; box-shadow: inset 0 0 0 1px rgba(255, 176, 0, 0.25), 0 6px 18px rgba(12, 37, 54, 0.18); color: var(--chrome-ink); display: flex; flex-direction: column; gap: 12px; }
.menu-board-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.menu-board-kicker { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--chrome-ink-2); }
.menu-board-title { font-family: var(--font-display); font-weight: 900; font-size: 30px; letter-spacing: 0.03em; color: var(--sign); text-transform: uppercase; line-height: 1; text-shadow: 0 0 14px rgba(255, 176, 0, 0.3); }
.family { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--chrome-3); border-radius: 8px; padding: 6px 10px; }
.family-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--chrome-ink-2); font-weight: 700; }
.family-per { color: var(--chrome-ink-2); font-size: 13px; }
.family-note { font-size: 11.5px; color: var(--chrome-ink-2); }
.family-effect { font-size: 11.5px; color: var(--chrome-ink-2); max-width: 300px; text-align: right; line-height: 1.35; }
.family-effect b { color: var(--chrome-ink); font-variant-numeric: tabular-nums; }
.menu-board .muted { color: var(--chrome-ink-2); }
.menu-board .input.money-in { background: #081a27; color: var(--sign); border-color: #2a4a62; font-family: var(--font-display); font-weight: 800; font-size: 20px; width: 86px; padding: 4px 7px; }
.menu-board .input.money-in:focus { border-color: var(--sign); box-shadow: 0 0 0 3px rgba(255, 176, 0, 0.2); }

.menu-tiers { display: grid; gap: 10px; }
.tier-card { background: #0a2233; border: 1px solid #23465f; border-radius: 9px; padding: 10px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.tier-card.top { border-color: rgba(255, 176, 0, 0.55); }
.tier-top { display: flex; align-items: center; gap: 8px; }
.tier-rank { width: 26px; height: 26px; border-radius: 6px; background: var(--sign); color: var(--sign-ink); font-family: var(--font-display); font-weight: 900; font-size: 16px; display: grid; place-items: center; flex: none; }
.tier-name { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 6px; color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 23px; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 5px; }
.tier-name:hover { border-color: #2a4a62; }
.tier-name:focus { border-color: var(--sign); outline: none; background: #081a27; }
.tier-x { border: 0; background: transparent; color: var(--chrome-ink-2); border-radius: 6px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; flex: none; }
.tier-x:hover:not(:disabled) { background: rgba(201, 58, 54, 0.25); color: #ffb4ae; }
.tier-x:disabled { opacity: 0.3; cursor: not-allowed; }
.tier-prices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tier-price { display: flex; flex-direction: column; gap: 3px; background: rgba(255, 255, 255, 0.03); border-radius: 7px; padding: 6px 7px; min-width: 0; }
.tier-price .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--chrome-ink-2); font-weight: 700; }
.tier-price .input.money-in { width: 100%; min-width: 0; }
.tier-price .row { flex-wrap: nowrap; }
.tier-price.club .input.money-in { color: #8fe0ff; }
.tier-value { display: flex; flex-direction: column; gap: 5px; }
.tier-value-bar { position: relative; height: 9px; border-radius: 5px; background: #142f42; overflow: visible; }
.tier-value-bar .v { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: linear-gradient(90deg, #0a9fc0, #5fd4ef); }
.tier-value-bar .p { position: absolute; top: -4px; width: 3px; height: 17px; background: var(--sign); border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 0 1px #0a2233; }
.tier-value-text { font-size: 12px; color: var(--chrome-ink-2); line-height: 1.3; }
.tier-value-text b { color: #fff; }
.tier-value-text .pos { color: #7be3a8; font-weight: 700; }
.tier-value-text .neg { color: #ff9a8f; font-weight: 700; }
.tier-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--chrome-ink-2); flex-wrap: wrap; }
.tier-meta b { color: var(--chrome-ink); font-variant-numeric: tabular-nums; }
.tier-steps { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #1d3d54; padding-top: 8px; }
.tier-stage { display: flex; flex-direction: column; gap: 4px; }
.tier-stage-name { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--chrome-ink-2); font-weight: 700; }
.tier-stage-steps { display: flex; flex-wrap: wrap; gap: 4px; }
.step-chk { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #2a4a62; border-radius: 999px; padding: 3px 9px 3px 6px; font-size: 12px; cursor: pointer; color: var(--chrome-ink-2); user-select: none; min-height: 28px; }
.step-chk input { width: 13px; height: 13px; margin: 0; accent-color: var(--accent); }
.step-chk.on { background: rgba(10, 159, 192, 0.22); border-color: var(--accent); color: #fff; }
.step-chk.req { cursor: default; opacity: 0.75; }
.step-chk:hover:not(.req) { border-color: #5fd4ef; }
.tier-delivery { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #1d3d54; padding-top: 8px; font-size: 12.5px; }
.tier-delivery > span { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.tier-delivery .ok { color: #7be3a8; }
.tier-delivery .warn { color: #ffcf66; }
.gap-link { display: flex; flex-direction: column; align-items: flex-start; gap: 0; border: 1px solid #2a4a62; background: rgba(255, 255, 255, 0.03); color: var(--chrome-ink); border-radius: 6px; padding: 4px 8px; cursor: pointer; text-align: left; min-width: 0; width: 100%; }
.gap-link:hover { border-color: var(--sign); }
.gap-link .ellipsis { max-width: 100%; font-weight: 600; }
.gap-miss { font-size: 11.5px; color: #ffb4ae; }
.gap-more { font-size: 11.5px; color: var(--chrome-ink-2); }

/* price check */
table.t.price-table td, table.t.price-table th { padding: 6px 6px; }
.price-chain { max-width: 170px; }
.price-verdict { display: flex; flex-direction: column; gap: 4px; }

/* sales mix */
.mix { display: flex; flex-direction: column; gap: 6px; }
.mix-head, .mix-row { display: grid; grid-template-columns: minmax(90px, 1.1fr) 1fr 1fr; gap: 10px; align-items: center; }
.mix-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 700; }
.mix-bar { position: relative; height: 22px; border-radius: 5px; background: var(--line-2); overflow: hidden; display: flex; align-items: center; }
.mix-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sign); opacity: 0.85; border-radius: 5px; }
.mix-bar.club i { background: var(--accent); opacity: 0.8; }
.mix-bar b { position: relative; padding-left: 7px; font-size: 12.5px; }
.mix-stats .stats { font-size: 13px; }

/* metro pricing */
.metro-row { display: flex; flex-direction: column; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.metro-row:last-child { border-bottom: 0; }
.metro-row input[type=range] { height: 28px; }
.metro-pct { font-family: var(--font-display); font-size: 20px; color: var(--sign-2); }

/* promotions */
.promo-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }
.promo-list { gap: 6px; }
.promo-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 7px; }
.promo-warn { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 7px; background: var(--panel-2); color: var(--ink-2); }
.promo-warn svg { flex: none; margin-top: 2px; color: var(--warn); }
.promo-warn.hot { background: var(--warn-soft); color: #7a4d00; }

@media (max-width: 1180px) {
  .menu-tiers { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}
@media (max-width: 760px) {
  .menu-board { padding: 10px; }
  .menu-board-title { font-size: 25px; }
  .menu-tiers { grid-template-columns: minmax(0, 1fr) !important; }
  .family { align-items: flex-start; width: 100%; }
  .family-effect { text-align: left; max-width: none; }
  .tier-name { font-size: 21px; }
  .mix-head, .mix-row { grid-template-columns: minmax(80px, 1fr) 1fr 1fr; gap: 6px; }
  .price-chain { max-width: 86px; }
  table.t.price-table td, table.t.price-table th { padding: 6px 4px; font-size: 13px; }
  table.t.price-table th { font-size: 9.5px; letter-spacing: 0.02em; }
  .price-table .cell-name .pill, .price-table .cell-name .tiny { display: none; }
}

/* news.css */
/* News feed and market pulse. Tone colors: nt-good / nt-bad / nt-neutral / nt-rival / nt-world (also used by the deal log and rival files). */
.nt-good { --tone: var(--good); }
.nt-bad { --tone: var(--bad); }
.nt-neutral { --tone: var(--ink-3); }
.nt-rival { --tone: #8b4fd8; }
.nt-world { --tone: var(--chrome-3); }
.dossier-news li[class^='nt-'], .deal-log li[class^='nt-'] { border-left-color: var(--tone); }

.news-layout { align-items: start; }
.news-panel .panel-body { gap: 12px; }
.news-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.news-count { font-size: 11px; color: var(--ink-3); font-weight: 700; margin-left: 2px; font-variant-numeric: tabular-nums; }
.news-search { flex: 1 1 180px; min-width: 0; display: flex; }
.news-search .input { width: 100%; }
.news-legend { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }
.news-legend span { display: inline-flex; align-items: center; gap: 5px; }
.news-legend i { width: 4px; height: 12px; border-radius: 2px; background: var(--tone); display: inline-block; }

.news-month { display: flex; flex-direction: column; gap: 4px; }
.news-month-h {
  font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: 0.02em;
  display: flex; align-items: baseline; gap: 10px; padding: 6px 0 4px; border-bottom: 2px solid var(--line);
  position: sticky; top: -16px; background: var(--panel); z-index: 1;
}
.news-month-h span { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.news-feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.news-item { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 8px 0 8px 10px; border-bottom: 1px solid var(--line-2); border-left: 4px solid var(--tone); }
.news-item:last-child { border-bottom: 0; }
.news-date { font-size: 12.5px; color: var(--ink-2); font-weight: 600; padding-top: 1px; white-space: nowrap; }
.news-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.news-text { font-size: 14px; overflow-wrap: anywhere; }
.news-text mark, .news-tag mark { background: var(--sign-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.news-meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.news-tone { color: var(--tone); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
.news-tag, .news-link, .news-chain {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel-2);
  border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; min-height: 24px;
}
.news-tag:hover, .news-link:hover, .news-chain:hover { border-color: var(--accent); color: var(--accent-2); }
.news-chain { background: var(--panel); }
.news-link { background: var(--sign-soft); border-color: transparent; color: #8a5a00; }

/* ----- market pulse ----- */
.pulse-list { display: flex; flex-direction: column; gap: 12px; }
.pulse { display: flex; flex-direction: column; gap: 3px; padding-bottom: 11px; border-bottom: 1px solid var(--line-2); }
.pulse:last-child { border-bottom: 0; padding-bottom: 0; }
.pulse-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pulse-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 700; }
.pulse-value { font-family: var(--font-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pulse-bar { height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.pulse-bar i { display: block; height: 100%; border-radius: 3px; background: var(--ink-3); }
.pulse-good .pulse-bar i { background: var(--good); }
.pulse-warn .pulse-bar i { background: var(--warn); }
.pulse-bad .pulse-bar i { background: var(--bad); }
.pulse-detail { font-size: 12.5px; font-weight: 700; }
.pulse-good .pulse-detail { color: var(--good); }
.pulse-warn .pulse-detail { color: var(--warn); }
.pulse-bad .pulse-detail { color: var(--bad); }
.pulse-neutral .pulse-detail { color: var(--ink-2); }
.pulse-meaning { font-size: 12.5px; color: var(--ink-2); }

@media (max-width: 760px) {
  .news-tools .seg { width: 100%; }
  .news-tools .seg button { min-height: 36px; flex: 1 1 auto; }
  .news-search .input { min-height: 40px; }
  .news-item { grid-template-columns: minmax(0, 1fr); gap: 2px; padding-left: 10px; }
  .news-tag, .news-link, .news-chain { min-height: 36px; padding: 4px 12px; }
  .news-month-h { top: -12px; }
}

/* people.css */
/* People screen */
.ppl-of { font-size: 15px; color: var(--ink-2); font-weight: 700; }
.ppl-layout { align-items: start; }
.ppl-policies .panel-body { gap: 0; }
.ppl-block { display: flex; flex-direction: column; gap: 7px; padding: 12px 0; border-top: 1px solid var(--line-2); }
.ppl-block:first-child { border-top: 0; padding-top: 2px; }
.ppl-block h3 { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: 0.02em; }
.ppl-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ppl-opt { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; color: var(--ink-2); min-height: 44px; position: relative; }
.ppl-opt b { color: var(--ink); font-size: 13.5px; }
.ppl-opt:hover { border-color: var(--ink-3); }
.ppl-opt.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: #f7fdff; }
.ppl-opt.cur::after { content: 'now'; position: absolute; top: 7px; right: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.ppl-opt-big { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--ink); line-height: 1.15; }
.ppl-opt-big small { font-size: 13px; color: var(--ink-2); margin-left: 1px; }
.ppl-seg-sub { display: block; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.seg button.on .ppl-seg-sub { color: var(--ink-2); }
.ppl-big { font-family: var(--font-display); font-size: 24px; font-weight: 800; }
.ppl-check { padding: 2px 0; flex-wrap: nowrap; }
.ppl-check > span { flex: 1; min-width: 0; }
.ppl-check input { flex: none; }
.ppl-scale { position: relative; height: 16px; margin: 0 8px; border-bottom: 1px dashed var(--line); }
.ppl-tick { position: absolute; bottom: 0; width: 4px; height: 12px; border-radius: 2px; transform: translateX(-2px); opacity: 0.85; }
.ppl-tick.you { background: var(--sign); height: 16px; width: 6px; transform: translateX(-3px); box-shadow: 0 0 0 1px var(--sign-2); opacity: 1; }
.ppl-side { gap: var(--gap); }
.ppl-cmp { display: grid; grid-template-columns: auto 1fr; gap: 6px 0; margin: 0; font-size: 13px; }
.ppl-cmp dt { color: var(--ink-2); }
.ppl-cmp dd { margin: 0; text-align: right; font-weight: 600; padding-left: 12px; }
.ppl-cmp .ppl-cmp-sep { border-top: 1px solid var(--line-2); padding-top: 6px; }
.ppl-word { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }
.ppl-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ink-3); transform: translateY(-1px); }
.ppl-dot.good { background: var(--good); }
.ppl-dot.warn { background: var(--warn); }
.ppl-dot.bad { background: var(--bad); }
.ppl-applybar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--chrome); color: var(--chrome-ink); border-radius: 9px; padding: 8px 10px 8px 12px; box-shadow: 0 6px 20px rgba(8, 20, 30, 0.3); }
.ppl-applybar .faint { color: var(--chrome-ink-2); }
.ppl-applybar .good-t { color: #7be3a8; }
.ppl-applybar .bad-t { color: #ff8a80; }
.ppl-applybar .btn.ghost { color: var(--chrome-ink); }
.ppl-applybar .btn.ghost:hover { background: var(--chrome-2); }
table.ppl-crews td { white-space: nowrap; }
table.ppl-way { max-width: 720px; }
table.ppl-way td { white-space: nowrap; }
table.ppl-way tr.ppl-way-total td { border-top: 2px solid var(--line); background: var(--panel-2); }
table.ppl-way tr.ppl-way-sep td { border-top: 2px solid var(--line); }
table.ppl-crews .row { flex-wrap: nowrap; }
.ppl-ratio { display: grid; grid-template-columns: minmax(70px, 160px) auto; gap: 8px; align-items: center; }
.ppl-ratio-track { height: 8px; border-radius: 4px; background: var(--line-2); overflow: hidden; display: block; }
.ppl-ratio-track i { display: block; height: 100%; border-radius: 4px; }
@media (max-width: 760px) {
  table.ppl-way td, table.ppl-way th { padding: 6px 4px; white-space: normal; font-size: 13px; }
  table.ppl-way th { font-size: 10.5px; }
  .ppl-opts { grid-template-columns: minmax(0, 1fr); }
  .ppl-opt { flex-direction: row; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .ppl-opt b { width: 100%; }
  .ppl-opt-big { font-size: 19px; }
  .ppl-ratio { grid-template-columns: 64px auto; }
}

/* rankings.css */
